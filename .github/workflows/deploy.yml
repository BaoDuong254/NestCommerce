name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  API_URL: https://nestcommerce-api.duonggiabao.com

jobs:
  server-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nestcommerce-server:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nestcommerce-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nestcommerce-server:buildcache,mode=max

  client:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env files
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        run: |
          printf '%s\n' "$SERVER_ENV" > server/.env
          printf '%s\n' "$CLIENT_ENV" > client/.env

      - name: Generate Prisma client
        run: pnpm --filter server exec prisma generate

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_API_ENDPOINT: ${{ env.API_URL }}

      - name: Export OpenAPI spec for static Swagger UI
        working-directory: server
        run: node dist/scripts/export-openapi.js ../client/dist/openapi.json
        env:
          # No Redis needed: the app is never started, connection errors are logged and ignored.
          REDIS_URL: redis://127.0.0.1:6379

      - name: Deploy to Cloudflare Workers
        working-directory: client
        run: pnpm dlx wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  notify:
    needs: [server-image, client]
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Send telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ (needs.server-image.result == 'success' && needs.client.result == 'success') && '✅ Deploy succeeded' || '❌ Deploy failed' }}
            🐳 Server image: ${{ needs.server-image.result }}
            🌐 Client + Swagger (Cloudflare): ${{ needs.client.result }}
            👤 ${{ github.event.workflow_run.actor.login }}: ${{ github.event.workflow_run.head_commit.message }}
            👀 https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
